name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to keep CI fast.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    container: rust:latest
    steps:
      - uses: actions/checkout@v7
      # The rust:* images install a minimal toolchain: rustfmt and clippy
      # are not part of it and must be added explicitly.
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    container: rust:latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # "1.85.0" is the declared MSRV (rust-version in Cargo.toml); the
        # point release is pinned because `rust:1.85` floats to the latest
        # patch of that minor.
        image: ["rust:latest", "rust:1.85.0"]
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --workspace --all-features --locked

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    container: rust:latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: cargo doc --workspace --all-features --no-deps

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    container: rust:latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --release --workspace --locked
