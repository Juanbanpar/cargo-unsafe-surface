name: Advisory checks

# Advisory and scheduled checks. These never gate pull requests; failures
# are reviewed during maintenance.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: Dependency and licence check
    runs-on: ubuntu-latest
    container: rust:latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container: rust:latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add llvm-tools-preview
      - run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - name: Report summary
        run: cargo llvm-cov report --workspace --all-features

  cross-compile:
    name: Cross-platform build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - run: cargo build --workspace --locked
