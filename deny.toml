# cargo-deny configuration.
#
# Role: enforce the licence policy and detect duplicate dependency versions,
# known vulnerabilities and banned crates. This is an advisory CI job: a
# failure never blocks the required test matrix but is reviewed promptly.

[graph]
all-features = true

[licenses]
# The dependency tree of this project is deliberately small and permissive.
# Keep this list tight; additions require justification in the PR.
allow = [
    # GPL-3.0 is this project's own licence; GPL dependencies are
    # compatible with it. Permissive licences below cover the current
    # dependency tree.
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate slow builds and enlarge the supply
# chain; warn so they can be pruned when practical.
multiple-versions = "warn"
wildcards = "deny"

[advisories]
db-url = "https://github.com/rustsec/advisory-db"
yanked = "deny"
